fragment ChatMessageFragment on Message {
  id
  conversationId
  renderedContent
  # Backend idempotency key: `in_app_chat:<clientMessageId>` for visitor sends. The SDK exposes
  # the bare client id as ChatMessage.clientMessageId for reconciling optimistic rows.
  externalUid
  senderId
  # `USER` for the visitor's own message; anything else is an agent or AI reply.
  aiRole
  turnSeq
  sentAt
  createdAt
}
