plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.apollographql.apollo'
    id 'com.vanniktech.maven.publish'
}

def sdkVersion = libs.versions.dashxAndroid.get()
def sdkGroup = libs.versions.group.get()
def sdkArtifactId = libs.versions.dashxAndroidArtifactId.get()

android {
    namespace 'com.dashx.android'

    compileSdk 34

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 100300100 // 1.3.1 -> 100300100, 1.5.4 -> 100500400 and so on...
        versionName sdkVersion

        buildConfigField 'String', 'VERSION_NAME', "\"$sdkVersion\""
        buildConfigField 'String', 'LIBRARY_NAME', "\"dashx-android\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            consumerProguardFiles 'consumer-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
        apiVersion = '1.9'
        languageVersion = '1.9'
    }
}

dependencies {
    implementation 'com.apollographql.apollo:apollo-runtime:4.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Process-level foreground/background for the realtime socket lifecycle.
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

    compileOnly platform('com.google.firebase:firebase-bom:31.5.0')
    compileOnly 'com.google.firebase:firebase-messaging-ktx:23.1.2'

    implementation('com.google.android.gms:play-services-ads-identifier') {
        version {
            require '[17.0.0, 18.99.99]'
            prefer '18.0.1'
        }
    }

    implementation('androidx.security:security-crypto') {
        version {
            require '[1.0.0, 1.1.99]'
            prefer '1.0.0'
        }
    }

    implementation 'androidx.browser:browser:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apollo {
    service("service") {
        packageName = "com.dashx.android.graphql.generated"

        srcDir("src/main/graphql")

        includes.add("**/*.graphql")

        mapScalar("JSON", "kotlinx.serialization.json.JsonObject")

        schemaFiles.from("$buildDir/graphql/schema.graphqls")

        introspection {
            endpointUrl = "https://api.dashx-staging.com/graphql"
            schemaFile = file("$buildDir/graphql/schema.graphqls")
        }
    }
}

tasks.named("preBuild") {
    dependsOn("downloadServiceApolloSchemaFromIntrospection")
}

mavenPublishing {
    coordinates(sdkGroup, sdkArtifactId, sdkVersion)

    publishToMavenCentral(true)

    if (!project.hasProperty('skipSigning')) {
        signAllPublications()
    }

    pom {
        name = 'DashX Android'
        description = 'DashX Android SDK'
        url = 'https://github.com/dashxhq/dashx-android'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/dashxhq/dashx-android/blob/main/LICENSE'
            }
        }

        developers {
            developer {
                id = 'gulshan.dashx'
                name = 'Gulshan Dhingra'
            }
        }

        scm {
            connection = 'scm:git:github.com/dashxhq/dashx-android.git'
            developerConnection = 'scm:git:ssh://github.com/dashxhq/dashx-android.git'
            url = 'https://github.com/dashxhq/dashx-android'
        }

        withXml {
            def deps = asNode().dependencies.dependency
            deps.each { dep ->
                def groupId = dep.groupId.text()
                if (groupId.startsWith('org.jetbrains.kotlin') || groupId.startsWith('org.jetbrains.kotlinx')) {
                    dep.scope*.value = 'runtime'
                }
            }
        }
    }
}
